device:
  cuda: true
  gpu_id: 0
  seed: 42

data:
  cache_root: "reports/point_family_hier_cache"
  train_mode: "train"
  eval_mode: "eval"
  max_files: 34
  max_tiles: null
  tile_selector: "manifest_default"

protocol:
  n_tiles: 8
  k_points_per_tile: 32
  depth_template:
    2: 1
    3: 2
    4: 2
    5: 3

visible_stats:
  include_local_structure: true
  local_grid_size: 4
  local_radial_bins: 4

model:
  point_feature_dim: 8
  visible_feature_dim: 95
  hidden_dim: 192
  file_dim: 192
  visible_hidden_dim: 160
  visible_dim: 128
  fusion_hidden_dim: 256
  fusion_dim: 192
  projector_dim: 128
  tile_encoder_type: "set_transformer"
  tile_num_heads: 4
  num_tile_layers: 2
  file_num_heads: 4
  num_file_layers: 3
  dropout: 0.1

loss:
  temperature: 0.07
  normalize: true

augmentation:
  feature_noise_std: 0.01
  visible_jitter_std: 0.01

validation:
  val_ratio: 0.25

training:
  epochs: 8
  batch_size_files: 8
  learning_rate: 0.0001
  weight_decay: 0.0001
  gradient_clip: 1.0
  num_workers: 0

logging:
  log_dir: "logs/point_hier_stage1_dual_view_hybrid_local"
  save_dir: "checkpoints/point_hier_stage1_dual_view_hybrid_local"
